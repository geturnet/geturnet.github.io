name: Auto Post Article Geturnet

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' muncul secara manual

jobs:
  build:
    runs-on: ubuntu-latest

    # --- INI WAJIB ADA AGAR BOT BISA COMMIT & PUSH ---
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Run Auto Poster Script
        run: |
          python auto_poster.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --cached --quiet || git commit -m "🤖 Auto-publish article via GitHub Actions"
          git push
